<title>The Ghostlight Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ THE GHOSTLIGHT ARCHIVE ============
   A committed single-world design: hearth-lit grimoire.
   Every colour painted explicitly; nothing borrowed from the host. */

:root{
  --ink:        #120E14;   /* black-plum ground */
  --ink-2:      #1A1320;   /* raised surface */
  --ink-3:      #241B2B;   /* rail / card */
  --ink-4:      #2F2436;   /* hover, input */
  --line:       #3A2D42;   /* hairline */
  --line-soft:  #2A2030;

  --hearth:     #E8C07A;   /* hearth-gold — headings, primary accent */
  --hearth-dim: #A98A56;
  --ember:      #C4483C;   /* crimson — sparing */
  --ember-dim:  #7E3129;

  --cream:      #F2E9DC;   /* reading panel ground */
  --cream-2:    #E7DCCB;
  --cream-ink:  #2A2028;   /* text on cream */
  --cream-mute: #6B5C63;

  --bone:       #D6CBC2;   /* body text on dark */
  --muted:      #968897;   /* plum-biased grey, chosen not inherited */
  --faint:      #6E6272;

  --ghost:      #9C86C4;   /* Ghost Haven */
  --specter:    #C86A48;   /* Specter Haven */
  --banshee:    #5E9E96;   /* Banshee Haven */

  --ok:         #7FA86B;
  --warn:       #D0A03F;

  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Spectral", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;

  --rail: 264px;
  --pad: 28px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--ink);
  color:var(--bone);
  font-family:var(--body);
  font-weight:300;
  font-size:15.5px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
a{color:var(--hearth);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--hearth);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
em{font-style:italic}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

.rail{
  background:linear-gradient(180deg,#1A1320 0%,#150F1A 100%);
  border-right:1px solid var(--line);
  padding:22px 18px 40px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:22px;
}
.rail::-webkit-scrollbar{width:8px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.brand{display:block;text-align:left}
.brand .mark{
  font-family:var(--serif);font-size:27px;font-weight:600;color:var(--hearth);
  line-height:1.05;letter-spacing:.005em;display:block;
}
.brand .sub{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--faint);margin-top:7px;display:block;
}
.brand:hover{text-decoration:none}
.brand:hover .mark{color:#F0CE93}

.searchwrap{position:relative}
.search{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:3px;
  padding:9px 11px 9px 30px;color:var(--bone);font-family:var(--mono);font-size:12px;
}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:var(--hearth-dim);outline:none}
.searchwrap .gl{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:12px;pointer-events:none}

nav.sections{display:flex;flex-direction:column;gap:1px}
nav.sections a{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:7px 9px;border-left:2px solid transparent;border-radius:0 2px 2px 0;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
nav.sections a:hover{background:var(--ink-3);color:var(--bone);text-decoration:none}
nav.sections a.on{color:var(--hearth);border-left-color:var(--hearth);background:var(--ink-3)}
nav.sections a .n{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- the arc lens ---------- */
.lens{border-top:1px solid var(--line-soft);padding-top:18px}
.lens h4{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--faint);font-weight:500;margin-bottom:4px;
}
.lens .reading{
  font-family:var(--serif);font-size:20px;color:var(--hearth);margin:2px 0 12px;
  display:flex;align-items:baseline;gap:7px;
}
.lens .reading .arcno{font-family:var(--mono);font-size:15px;font-weight:600}
.lens .reading .arcname{font-size:14px;color:var(--muted);font-family:var(--body);font-style:italic}
.dial{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);margin-left:5px}
.dial button{
  display:flex;align-items:center;gap:9px;padding:2.5px 0 2.5px 0;
  font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:left;width:100%;
  position:relative;transition:color .12s;
}
.dial button .tick{width:13px;height:1px;background:var(--line);flex:none;transition:all .12s}
.dial button .lbl{opacity:.75;transition:opacity .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dial button:hover{color:var(--bone)}
.dial button:hover .tick{background:var(--hearth-dim);width:19px}
.dial button.on{color:var(--hearth)}
.dial button.on .tick{background:var(--hearth);width:23px;height:2px}
.dial button.on .lbl{opacity:1;font-weight:600}
.dial button.past{color:var(--muted)}
.dial button.past .tick{background:var(--hearth-dim)}
.lensnote{font-size:12px;color:var(--faint);line-height:1.5;margin-top:12px;font-style:italic}

.railfoot{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.dbstate{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:7px}
.dbstate .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.dbstate.live .dot{background:var(--ok);box-shadow:0 0 7px rgba(127,168,107,.8)}
.dbstate.local .dot{background:var(--warn)}
.railfoot .sig{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--faint)}

/* ---------- main ---------- */
main{padding:0 0 90px;min-width:0}
.arcband{
  position:sticky;top:0;z-index:40;
  background:rgba(18,14,20,.93);backdrop-filter:blur(9px);
  border-bottom:1px solid var(--line);
  padding:9px var(--pad);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.arcband b{color:var(--hearth);font-weight:600}
.arcband .spacer{flex:1}
.arcband .modeswitch{display:flex;gap:2px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.arcband .modeswitch button{padding:3px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.arcband .modeswitch button.on{background:var(--hearth);color:var(--ink);font-weight:600}
.arcband .modeswitch button:hover:not(.on){background:var(--ink-3);color:var(--bone)}

.page{padding:0 var(--pad);max-width:1180px}
.page.wide{max-width:1400px}

/* ---------- page head ---------- */
.phead{padding:38px 0 22px;border-bottom:1px solid var(--line);margin-bottom:30px}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--hearth-dim);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.phead h1{font-size:clamp(34px,5vw,52px);color:var(--cream);letter-spacing:-.01em}
.phead h1 .sm{color:var(--muted);font-size:.55em;font-style:italic;font-weight:400}
.titles{
  font-family:var(--serif);font-size:17px;font-style:italic;color:var(--hearth);
  margin-top:9px;letter-spacing:.01em;
}
.phead .lede{margin-top:14px;max-width:62ch;color:var(--muted);font-size:15px}

/* ---------- chips ---------- */
.chip{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  padding:2.5px 7px;border:1px solid var(--line);border-radius:2px;color:var(--muted);
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.chip.state-current{border-color:var(--hearth-dim);color:var(--hearth)}
.chip.state-historical{border-color:#5B4C74;color:#9C86C4}
.chip.state-draft{border-color:var(--line);color:var(--faint)}
.chip.state-proposed{border-color:#3E6B66;color:var(--banshee)}
.chip.state-disputed{border-color:var(--ember-dim);color:var(--ember)}
.chip.state-retired{border-color:#3A3542;color:#6E6A78}
.chip.house-ghost-haven{border-color:#5B4C74;color:var(--ghost)}
.chip.house-specter-haven{border-color:#77462F;color:var(--specter)}
.chip.house-banshee-haven{border-color:#3E6B66;color:var(--banshee)}
.chip.stub{border-style:dashed}
.chip.solid{background:var(--hearth);color:var(--ink);border-color:var(--hearth);font-weight:600}

/* ---------- section blocks ---------- */
section.blk{margin-bottom:44px;scroll-margin-top:70px}
.blkhead{
  display:flex;align-items:baseline;gap:14px;margin-bottom:16px;
  border-bottom:1px solid var(--line-soft);padding-bottom:8px;
}
.blkhead h2{
  font-size:13px;font-family:var(--mono);font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--hearth);
}
.blkhead .hint{font-size:12.5px;color:var(--faint);font-style:italic;margin-left:auto;text-align:right}

/* ---------- ledger (the spec register) ---------- */
.ledger{display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:0 20px}
.ledger dt{
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);padding:7px 0;border-top:1px solid var(--line-soft);
}
.ledger dd{
  margin:0;padding:7px 0;border-top:1px solid var(--line-soft);color:var(--bone);
  font-size:14.5px;min-width:0;overflow-wrap:break-word;
}
.ledger dd.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--cream)}
.ledger dd .sup{color:var(--faint);text-decoration:line-through;margin-right:8px}
.ledger dd .repl{color:var(--hearth)}
.ledger dt:first-of-type,.ledger dd:first-of-type{border-top:none}

/* modifier row — signed deltas, the Nereid register */
.mods{display:flex;flex-wrap:wrap;gap:0;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;margin-top:2px}
.mods span{padding:3px 10px;border:1px solid var(--line);border-right:none;color:var(--bone)}
.mods span:last-child{border-right:1px solid var(--line)}
.mods span b{color:var(--faint);font-weight:500;margin-right:5px;font-size:10px;letter-spacing:.1em}
.mods span.pos b{color:var(--hearth-dim)}
.mods span.neg{color:var(--muted)}

/* ---------- reading panel (long prose on cream) ---------- */
.panel{
  background:var(--cream);color:var(--cream-ink);
  padding:22px 26px;border-radius:2px;
  box-shadow:0 1px 0 rgba(232,192,122,.14), 0 10px 30px -18px rgba(0,0,0,.85);
  max-width:66ch;font-size:15.5px;line-height:1.68;
}
.panel + .panel{margin-top:14px}
.panel h3{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--cream-mute);font-weight:600;margin-bottom:9px;
}
.panel p + p{margin-top:11px}
.panel .attrib{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--cream-mute);margin-top:12px;text-transform:uppercase}
.panelrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}

/* ---------- rosters & tiles ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.roster.pair{grid-template-columns:repeat(2,minmax(0,1fr));max-width:720px}
.rcard{
  background:var(--ink);padding:13px 15px;display:flex;flex-direction:column;gap:3px;
  transition:background .13s;min-width:0;
}
.rcard:hover{background:var(--ink-3);text-decoration:none}
.rcard .nm{font-family:var(--serif);font-size:19px;color:var(--cream);line-height:1.15}
.rcard:hover .nm{color:var(--hearth)}
.rcard .tt{font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);
  margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;text-transform:uppercase}
.rcard .meta .hc{color:var(--muted)}
.rcard.is-stub{border-left:2px solid var(--line)}
.rcard.is-deep{border-left:2px solid var(--hearth-dim)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.tile{
  border:1px solid var(--line);background:var(--ink-2);padding:17px 19px;border-radius:2px;
  display:flex;flex-direction:column;gap:7px;transition:border-color .14s,background .14s;
}
.tile:hover{border-color:var(--hearth-dim);background:var(--ink-3);text-decoration:none}
.tile .tnum{font-family:var(--mono);font-size:26px;color:var(--hearth);font-variant-numeric:tabular-nums;line-height:1}
.tile h3{font-size:21px;color:var(--cream)}
.tile:hover h3{color:var(--hearth)}
.tile p{font-size:13.5px;color:var(--muted);line-height:1.5}
.tile.house{border-left-width:3px}
.tile.house.ghost-haven{border-left-color:var(--ghost)}
.tile.house.specter-haven{border-left-color:var(--specter)}
.tile.house.banshee-haven{border-left-color:var(--banshee)}

/* ---------- timeline of canon changes ---------- */
.timeline{display:flex;flex-direction:column;border-left:1px solid var(--line);margin-left:6px}
.tl{display:grid;grid-template-columns:74px minmax(0,1fr);gap:0 18px;padding:14px 0 14px 0;position:relative}
.tl::before{
  content:"";position:absolute;left:-4px;top:21px;width:7px;height:7px;border-radius:50%;
  background:var(--ink);border:1px solid var(--hearth-dim);
}
.tl.on::before{background:var(--hearth);border-color:var(--hearth);box-shadow:0 0 9px rgba(232,192,122,.55)}
.tl.future::before{border-color:var(--line)}
.tl.future{opacity:.4}
.tl .when{
  font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--hearth-dim);padding-left:16px;padding-top:3px;white-space:nowrap;
}
.tl.future .when{color:var(--faint)}
.tl .what{min-width:0}
.tl .what h4{font-size:19px;color:var(--cream);margin-bottom:4px}
.tl .what .delta{font-family:var(--mono);font-size:12px;margin:5px 0 6px;line-height:1.6}
.tl .what .delta .was{color:var(--faint);text-decoration:line-through}
.tl .what .delta .arrow{color:var(--hearth-dim);margin:0 8px}
.tl .what .delta .now{color:var(--hearth)}
.tl .what .note{font-size:14px;color:var(--muted);max-width:62ch}
.tl .what .links{margin-top:7px;display:flex;gap:7px;flex-wrap:wrap}

/* ---------- gallery ---------- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.plate{border:1px solid var(--line);background:var(--ink-2);border-radius:2px;overflow:hidden;display:flex;flex-direction:column}
.plate img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--ink-3)}
.plate .cap{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.plate .cap .lb{font-size:13px;color:var(--bone);line-height:1.3}
.plate .cap .st{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.plate .cap .st.canonical{color:var(--hearth)}
.plate .rm{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.1em;text-align:left;padding:0 10px 8px}
.plate .rm:hover{color:var(--ember)}
.dropzone{
  border:1px dashed var(--line);border-radius:2px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;aspect-ratio:3/4;padding:14px;text-align:center;
  color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  transition:border-color .14s,color .14s;
}
.dropzone:hover,.dropzone.hot{border-color:var(--hearth);color:var(--hearth)}
.dropzone .big{font-size:22px;font-family:var(--serif);letter-spacing:0;text-transform:none}

/* portrait beside the dossier head */
.dossier{display:grid;grid-template-columns:212px minmax(0,1fr);gap:28px;align-items:start}
.dossier .portrait{
  border:1px solid var(--line);background:var(--ink-2);border-radius:2px;overflow:hidden;
  aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;position:relative;
}
.dossier .portrait img{width:100%;height:100%;object-fit:cover;display:block}
.dossier .portrait .empty{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);text-align:center;padding:16px;line-height:1.8;
}
.dossier .portrait .empty .glyph{font-family:var(--serif);font-size:44px;color:var(--line);display:block;margin-bottom:8px}
@media (max-width:820px){.dossier{grid-template-columns:1fr}.dossier .portrait{max-width:212px}}

/* ---------- edit surface ---------- */
.editbar{
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  padding:11px 14px;border:1px solid var(--line);border-radius:2px;background:var(--ink-2);margin-bottom:22px;
}
.btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 13px;border:1px solid var(--line);border-radius:2px;color:var(--muted);transition:all .13s;
}
.btn:hover{border-color:var(--hearth-dim);color:var(--hearth);background:var(--ink-3)}
.btn.primary{background:var(--hearth);color:var(--ink);border-color:var(--hearth);font-weight:600}
.btn.primary:hover{background:#F2D08C;color:var(--ink)}
.btn.danger:hover{border-color:var(--ember);color:var(--ember)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.editbar .hintx{font-size:12.5px;color:var(--faint);font-style:italic;margin-left:auto}

[contenteditable="true"]{
  background:var(--ink-4);outline:1px solid var(--line);border-radius:2px;
  padding:2px 6px;margin:-2px -6px;cursor:text;display:inline-block;min-width:40px;
}
[contenteditable="true"]:focus{outline:1px solid var(--hearth);background:#382B41}
.panel [contenteditable="true"]{background:var(--cream-2);outline-color:#C9BBA6;display:block;margin:0;padding:6px 8px}
.panel [contenteditable="true"]:focus{outline-color:#A98A56;background:#EFE3D0}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(10,7,12,.82);backdrop-filter:blur(3px);
  z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px 20px;overflow-y:auto;
}
.modal{
  background:var(--ink-2);border:1px solid var(--line);border-radius:3px;
  width:100%;max-width:620px;padding:26px 28px 24px;
  box-shadow:0 30px 80px -30px #000;
}
.modal h3{font-size:26px;color:var(--cream);margin-bottom:5px}
.modal .sub{font-size:13.5px;color:var(--muted);margin-bottom:20px;font-style:italic}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.field input,.field select,.field textarea{
  background:var(--ink);border:1px solid var(--line);border-radius:2px;padding:8px 10px;
  color:var(--bone);font-family:var(--body);font-size:14.5px;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--hearth-dim);outline:none}
.field textarea{min-height:80px;resize:vertical;line-height:1.55}
.field .fh{font-size:12px;color:var(--faint);font-style:italic}
.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;border-top:1px solid var(--line-soft);padding-top:16px}

/* ---------- search results ---------- */
.hits{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.hit{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;padding:12px 6px;border-bottom:1px solid var(--line-soft);align-items:baseline}
.hit:hover{background:var(--ink-2);text-decoration:none}
.hit .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--hearth-dim);padding-top:3px}
.hit .nm{font-family:var(--serif);font-size:20px;color:var(--cream)}
.hit:hover .nm{color:var(--hearth)}
.hit .ex{font-size:13px;color:var(--muted);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hit mark{background:rgba(232,192,122,.22);color:var(--hearth);padding:0 1px}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink-3);border:1px solid var(--hearth-dim);color:var(--hearth);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:10px 18px;border-radius:2px;z-index:200;box-shadow:0 16px 40px -18px #000;
}
.toast.bad{border-color:var(--ember);color:var(--ember)}

/* ---------- quotations ---------- */
.quote{margin:0 0 16px;max-width:64ch;border-left:2px solid var(--hearth-dim);padding:2px 0 2px 22px}
.quote blockquote{
  margin:0;font-family:var(--serif);font-size:26px;line-height:1.3;color:var(--cream);
  font-style:italic;text-wrap:balance;
}
.quote blockquote::before{content:"\201C";color:var(--hearth-dim);margin-right:2px}
.quote blockquote::after{content:"\201D";color:var(--hearth-dim);margin-left:2px}
.quote figcaption{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint);
  margin-top:9px;line-height:1.55;
}
.quote figcaption b{color:var(--hearth);font-weight:600;letter-spacing:.14em;text-transform:uppercase}

/* ---------- misc ---------- */
.empty-note{color:var(--faint);font-style:italic;font-size:14px;padding:14px 0}
.kv-inline{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.kv-inline b{color:var(--faint);font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:9.5px;margin-right:5px}
.crosslinks{display:flex;flex-wrap:wrap;gap:7px}
.xlink{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:4px 9px;
  border:1px solid var(--line);border-radius:2px;color:var(--muted);
}
.xlink:hover{border-color:var(--hearth-dim);color:var(--hearth);text-decoration:none;background:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:2px 7px;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:2px}
.tag:hover{color:var(--hearth);border-color:var(--hearth-dim);text-decoration:none}
ul.plain{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
ul.plain li{padding-left:16px;position:relative;font-size:14.5px;color:var(--bone);line-height:1.55}
ul.plain li::before{content:"—";position:absolute;left:0;color:var(--hearth-dim)}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;align-items:start}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .dial{flex-direction:row;flex-wrap:wrap;border-left:none;margin-left:0;gap:4px}
  .dial button{width:auto;padding:4px 9px;border:1px solid var(--line);border-radius:2px}
  .dial button .tick{display:none}
  .dial button.on{border-color:var(--hearth)}
  :root{--pad:18px}
}
